<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sakura-tree: as a page background</title>
<style>
  html, body { margin: 0; min-height: 100%; }
  body { background: linear-gradient(#fff3f7, #ffffff 60%, #eaf6ee); font: 18px/1.6 system-ui, sans-serif; color: #2b2330; }
  main { max-width: 560px; margin: 0 auto; padding: 18vh 24px 40vh; }
  h1 { font-size: 44px; margin: 0 0 8px; }
  .card { background: #fffffff0; border-radius: 14px; padding: 18px 22px; box-shadow: 0 10px 30px #3a1f3a18; }
  a.button { display: inline-block; margin-top: 12px; padding: 10px 18px; border-radius: 999px; background: #e0709a; color: #fff; text-decoration: none; }
</style>

<main>
  <h1>Hanami</h1>
  <p class="card">
    The tree and the petals are drawn on a canvas behind this page. The page stays fully clickable:
    <a class="button" href="#hello">like this button</a>
  </p>
</main>

<script type="module">
  import { createSakura } from "../lib/index.js";

  // The whole window, behind your content, with nothing but the tree, petals and rain drawn.
  window.sakura = createSakura(document.body, {
    background: "transparent",
    interactive: false, // clicks go to the page, not the tree
    form: "yoshino",
    petals: 4,
  });
</script>
