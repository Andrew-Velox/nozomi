<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sakura-tree: in an element</title>
<style>
  html, body { margin: 0; height: 100%; background: #14101c; }
  #tree { width: 100%; height: 100%; }
</style>

<div id="tree"></div>

<script type="module">
  // Grow a tree inside any element (or a CSS selector).
  import { createSakura } from "../lib/index.js";

  const sakura = createSakura("#tree", { palette: "lavender", form: "shidare", weather: "moonlight", rain: true });

  window.sakura = sakura; // so you can try sakura.set({ palette: "mint" }) in the console
</script>
