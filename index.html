<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1322" />
    <meta
      name="description"
      content="Sakura is a procedurally grown cherry blossom tree with petals drifting down on the wind."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Sakura</title>
  </head>
  <body>
    <canvas id="scene" aria-label="A cherry blossom tree with petals falling around it"></canvas>

    <header class="brand"><span class="kanji">桜</span> Sakura</header>

    <nav class="dock" aria-label="Controls">
      <button id="btn-style" type="button" title="Tree form (S)"><span id="style-label">yoshino</span><kbd>S</kbd></button>
      <button id="btn-palette" type="button" title="Blossom colour (C)"><i id="swatch" class="swatch"></i><span id="palette-label">sakura</span><kbd>C</kbd></button>
      <button id="btn-weather" type="button" title="Weather (E)"><span id="weather-label">clear</span><kbd>E</kbd></button>
      <button id="btn-lightning" type="button" title="Lightning (L)" aria-pressed="false">lightning <span id="lightning-label">off</span><kbd>L</kbd></button>
      <button id="btn-detail" type="button" title="Detail mode (D)" aria-pressed="false">detail <span id="detail-label">off</span><kbd>D</kbd></button>
      <button id="btn-wind" type="button" title="Wind on/off (A)" aria-pressed="true">wind <span id="wind-label">on</span><kbd>A</kbd></button>
      <button id="btn-sound" type="button" title="Wind sound (M)" aria-pressed="false">sound <span id="sound-label">off</span><kbd>M</kbd></button>
      <button id="btn-hide" type="button" title="Hide interface (H)">hide<kbd>H</kbd></button>
    </nav>

    <p class="hint" id="hint">
      click the tree to shake it <i>·</i> <kbd>space</kbd> gust <i>·</i> <kbd>p</kbd> petals
      <i>·</i> <kbd>w</kbd> wind <i>·</i> <kbd>e</kbd> weather <i>·</i> <kbd>l</kbd> lightning <i>·</i> <kbd>r</kbd> regrow
    </p>
    <div class="toast" id="toast" role="status"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
