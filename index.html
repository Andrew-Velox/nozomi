<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1322" />
    <meta
      name="description"
      content="Sakura is a procedurally grown cherry blossom tree with petals drifting down on the wind."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Sakura</title>
  </head>
  <body>
    <canvas id="scene" aria-label="A cherry blossom tree with petals falling around it"></canvas>

    <header class="brand"><span class="kanji">桜</span> Sakura</header>

    <p class="hint" id="hint">
      click the tree to shake it <i>·</i> <kbd>r</kbd> regrow <i>·</i> <kbd>w</kbd> wind strength
      <i>·</i> <kbd>e</kbd> weather <i>·</i> <kbd>y</kbd> rain
    </p>

    <div class="bar" id="bar" role="toolbar" aria-label="Controls">
      <button class="btn" id="btn-ambient" type="button" title="Ambient mode: fullscreen, controls fade when idle (F)">
        <span data-icon="maximize"></span><span class="lbl">Ambient</span><kbd>F</kbd>
      </button>

      <div class="menu-wrap">
        <button class="btn" id="btn-fps" type="button" title="Frame rate" aria-haspopup="true" aria-expanded="false">
          <span data-icon="gauge"></span><span class="lbl" id="fps-label">60 fps</span>
        </button>
        <div class="menu" hidden></div>
      </div>

      <button class="btn" id="btn-hide" type="button" title="Hide interface (H)">
        <span data-icon="eyeoff"></span><span class="lbl">Hide UI</span><kbd>H</kbd>
      </button>

      <span class="sep"></span>

      <button class="btn accent" id="btn-gust" type="button" title="Send a gust through the tree (Space)">
        <span data-icon="shuffle"></span><span class="lbl">Gust</span><kbd>Space</kbd>
      </button>

      <span class="sep"></span>

      <div class="stepper" title="Petals ( p / P )">
        <button id="petal-minus" type="button" aria-label="Fewer petals"><span data-icon="minus"></span></button>
        <span id="petal-count">5</span>
        <button id="petal-plus" type="button" aria-label="More petals"><span data-icon="plus"></span></button>
      </div>

      <div class="menu-wrap">
        <button class="btn" id="btn-weather" type="button" title="Weather (E)" aria-haspopup="true" aria-expanded="false">
          <span id="weather-icon"></span><span class="lbl" id="weather-label">Clear</span>
        </button>
        <div class="menu" hidden></div>
      </div>

      <div class="menu-wrap">
        <button class="btn" id="btn-style" type="button" title="Tree form (S)" aria-haspopup="true" aria-expanded="false">
          <span data-icon="leaf"></span><span class="lbl" id="style-label">Yoshino</span>
        </button>
        <div class="menu" hidden></div>
      </div>

      <div class="menu-wrap">
        <button class="btn" id="btn-palette" type="button" title="Blossom colour (C)" aria-haspopup="true" aria-expanded="false">
          <i class="swatch" id="swatch"></i><span class="lbl" id="palette-label">Sakura</span>
        </button>
        <div class="menu" hidden></div>
      </div>

      <span class="sep"></span>

      <button class="item" id="sw-detail" type="button" role="switch" aria-checked="false" title="Detail mode (D)">
        <span data-icon="layers"></span><span class="lbl">Detail</span><span class="track"><span class="knob"></span></span>
      </button>
      <button class="item" id="sw-wind" type="button" role="switch" aria-checked="true" title="Wind on/off (A)">
        <span data-icon="wind"></span><span class="lbl">Wind</span><span class="track"><span class="knob"></span></span>
      </button>
      <button class="item" id="sw-rain" type="button" role="switch" aria-checked="false" title="Rain (Y)">
        <span data-icon="rain"></span><span class="lbl">Rain</span><span class="track"><span class="knob"></span></span>
      </button>
      <button class="item" id="sw-sound" type="button" role="switch" aria-checked="false" title="Sound: wind, rain and chimes (M)">
        <span data-icon="volume"></span><span class="lbl">Sound</span><span class="track"><span class="knob"></span></span>
      </button>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
